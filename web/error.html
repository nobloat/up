{{define "main"}}<div class="error">
<p class="code">{{.BaseTitle}}</p>
<h1>{{.ErrTitle}}</h1>
<p>{{.ErrText}}</p>
{{with .Ref}}<p><code class="id">{{.}}</code> <button type="button" class="round copy" data-copy="{{.}}" title="{{$.T "btn.copy"}}" aria-label="{{$.T "btn.copy"}}: {{.}}"></button></p>{{end}}
<div class="row"><a class="btn pri" href="/"><i class="icon-list" aria-hidden="true"></i> {{.T "err.monitors"}}</a>{{if .Ref}}<a class="btn" href="{{.Here}}"><i class="icon-refresh" aria-hidden="true"></i> {{.T "err.retry"}}</a>{{else}}<button type="button" data-palette><i class="icon-search" aria-hidden="true"></i> {{.T "palette.search"}} <kbd>Ctrl K</kbd></button>{{end}}{{if eq .Code 403}}<a class="btn" href="/settings"><i class="icon-user" aria-hidden="true"></i> {{.T "err.account"}}</a>{{end}}</div>
</div>{{end}}
