# Global settings. Every other .conf file is one entity, named by its path, kind by its suffix:
#   <name>.monitor.conf    (subdirectories allowed: prod/api.monitor.conf is prod/api)
#   <name>.notifier.conf
#   <slug>.page.conf       (status pages)
# One "key = value" per line, # starts a comment line, lists are comma separated.

listen = 127.0.0.1:7493
base_url = http://127.0.0.1:7493
data_dir = data
auth.user = admin
auth.password = admin
evaluation_interval = 30s
heartbeat.urls = https://httpbin.org/get
heartbeat.interval = 5m
