# Global settings. Every other .conf file is one entity, named by its file name, kind by its suffix:
#   <name>.monitor.conf
#   <name>.notifier.conf
#   <slug>.page.conf       (status pages)
# One "key = value" per line, # starts a comment line, lists are comma separated.

listen = 127.0.0.1:7493
base_url = http://127.0.0.1:7493
data_dir = data
auth.user = admin
auth.password = admin
evaluation_interval = 30s
heartbeat.urls = https://httpbin.org/get
heartbeat.interval = 5m
design = graphite
brand_color = #3b6e94
brand_color_dark = #7aa7c9
