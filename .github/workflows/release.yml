name: release
on:
  push:
    tags: ['*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make push TAG=${{ github.ref_name }}
      - run: docker tag ghcr.io/nobloat/up:${{ github.ref_name }} ghcr.io/nobloat/up:latest && docker push ghcr.io/nobloat/up:latest
